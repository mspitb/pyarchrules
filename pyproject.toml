[project]
name = "pyarchrules"
version = "0.1.0"
description = "Architecture validation library for Python projects"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [
    { name = "Sergei Mikheev" }
]
keywords = ["architecture", "validation", "testing", "monorepo", "microservices"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "tomlkit>=0.12.0",
    "typer>=0.9.0",
]

[project.urls]
Homepage = "https://github.com/mspitb/pyarchrules"
Documentation = "https://mspitb.github.io/pyarchrules"
Repository = "https://github.com/mspitb/pyarchrules"
Issues = "https://github.com/mspitb/pyarchrules/issues"

[tool.uv]
package = true
dev-dependencies = [
    "pytest>=9.0.2,<10.0.0",
    "isort>=7.0.0,<8.0.0",
    "ruff>=0.15.1,<1.0.0",
    "black>=26.0.0,<27.0.0",
    "mkdocs>=1.6.1,<2.0.0",
    "mkdocs-material>=9.7.2,<10.0.0",
]

[project.scripts]
pyarchrules = "pyarchrules.cli:main"

[tool.pytest.ini_options]
markers = [
    "unit: Unit tests for core logic (fast, isolated)",
    "cli: CLI command tests using Typer's CliRunner",
    "integration: End-to-end integration tests (slower)",
]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = []

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.isort]
profile = "black"
line_length = 100
