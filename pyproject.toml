[project]
name = "pyarchrules"
version = "1.0.0"
description = "Architecture validation library for Python projects"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [
    { name = "Sergei Mikheev" }
]
keywords = ["architecture", "validation", "testing", "monorepo", "microservices"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "tomlkit>=0.12.0",
    "typer>=0.9.0",
]

[project.urls]
Homepage = "https://github.com/mspitb/pyarchrules"
Documentation = "https://mspitb.github.io/pyarchrules"
Repository = "https://github.com/mspitb/pyarchrules"
Issues = "https://github.com/mspitb/pyarchrules/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md", "LICENSE", "pyproject.toml"]

[tool.hatch.build.targets.wheel]
packages = ["src/pyarchrules"]

[dependency-groups]
dev = [
    "pytest>=9.0.2,<10.0.0",
    "ruff==0.15.12",
    "mkdocs>=1.6.1,<2.0.0",
    "mkdocs-material>=9.7.2,<10.0.0",
]

[project.scripts]
pyarchrules = "pyarchrules.cli:main"

[tool.pytest.ini_options]
markers = [
    "unit: Unit tests for core logic (fast, isolated)",
    "cli: CLI command tests using Typer's CliRunner",
    "integration: End-to-end integration tests (slower)",
]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = []
