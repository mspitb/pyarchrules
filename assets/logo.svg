<svg
  width="100"
  height="100"
  viewBox="0 0 100 100"
  xmlns="http://www.w3.org/2000/svg"
>
  <defs>
    <linearGradient id="iconGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
  </defs>
  
  <!-- Tree-style architecture diagram - 3 rectangles -->
  <rect
    x="35"
    y="15"
    width="30"
    height="18"
    rx="3"
    fill="url(#iconGradient)"
    opacity="0.9"
  />
  
  <rect
    x="15"
    y="60"
    width="28"
    height="18"
    rx="3"
    fill="url(#iconGradient)"
    opacity="0.85"
  />
  
  <rect
    x="57"
    y="60"
    width="28"
    height="18"
    rx="3"
    fill="url(#iconGradient)"
    opacity="0.85"
  />
  
  <!-- Connection lines - tree structure -->
  <line
    x1="50"
    y1="33"
    x2="50"
    y2="48"
    stroke="#2563eb"
    stroke-width="2.5"
    opacity="0.7"
    stroke-linecap="round"
  />
  <line
    x1="29"
    y1="48"
    x2="71"
    y2="48"
    stroke="#2563eb"
    stroke-width="2.5"
    opacity="0.7"
    stroke-linecap="round"
  />
  <line
    x1="29"
    y1="48"
    x2="29"
    y2="60"
    stroke="#2563eb"
    stroke-width="2.5"
    opacity="0.7"
    stroke-linecap="round"
  />
  <line
    x1="71"
    y1="48"
    x2="71"
    y2="60"
    stroke="#2563eb"
    stroke-width="2.5"
    opacity="0.7"
    stroke-linecap="round"
  />
</svg>