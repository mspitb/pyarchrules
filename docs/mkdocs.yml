site_name: PyArchRules
site_url: https://mspitb.github.io/pyarchrules/
site_description: Architecture validation library for Python projects
site_author: Sergei Mikheev
repo_url: https://github.com/mspitb/pyarchrules
repo_name: mspitb/pyarchrules
docs_dir: docs
copyright: Copyright &copy; 2024-2026 Sergei Mikheev

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: cyan
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: cyan
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - content.code.copy
    - navigation.top
    - navigation.instant
    - navigation.sections
    - navigation.footer
    - search.highlight
    - search.suggest
    - toc.follow

plugins:
  - search

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Configuration: configuration.md
  - CLI Reference: cli.md
  - Python DSL: dsl.md
  - Use Cases: use-cases.md
  - Changelog: changelog.md
