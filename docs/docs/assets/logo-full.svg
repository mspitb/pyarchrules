<svg
  width="380"
  height="80"
  viewBox="0 0 380 80"
  xmlns="http://www.w3.org/2000/svg"
>
  <defs>
    <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
  </defs>
  
  <!-- Icon: Tree-style architecture diagram -->
  <g transform="translate(25, 15)">
    <!-- Top node (root) -->
    <rect
      x="16"
      y="0"
      width="28"
      height="16"
      rx="2.5"
      fill="url(#gradient)"
      opacity="0.9"
    />
    
    <!-- Bottom left node -->
    <rect
      x="0"
      y="40"
      width="26"
      height="16"
      rx="2.5"
      fill="url(#gradient)"
      opacity="0.85"
    />
    
    <!-- Bottom right node -->
    <rect
      x="34"
      y="40"
      width="26"
      height="16"
      rx="2.5"
      fill="url(#gradient)"
      opacity="0.85"
    />
    
    <!-- Connection lines - tree structure -->
    <line
      x1="30"
      y1="16"
      x2="30"
      y2="30"
      stroke="#2563eb"
      stroke-width="2"
      opacity="0.7"
      stroke-linecap="round"
    />
    <line
      x1="13"
      y1="30"
      x2="47"
      y2="30"
      stroke="#2563eb"
      stroke-width="2"
      opacity="0.7"
      stroke-linecap="round"
    />
    <line
      x1="13"
      y1="30"
      x2="13"
      y2="40"
      stroke="#2563eb"
      stroke-width="2"
      opacity="0.7"
      stroke-linecap="round"
    />
    <line
      x1="47"
      y1="30"
      x2="47"
      y2="40"
      stroke="#2563eb"
      stroke-width="2"
      opacity="0.7"
      stroke-linecap="round"
    />
  </g>
  
  <!-- Text: PyArchRules -->
  <text
    x="108"
    y="54"
    font-family="'Inter', 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif"
    font-size="42"
    font-weight="600"
    fill="url(#textGradient)"
    letter-spacing="-0.5"
  >
    PyArchRules
  </text>
</svg>